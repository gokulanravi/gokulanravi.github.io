<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Move Out Sale</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }
        
        .sheet-container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            min-height: 600px;
        }
        
        iframe {
            width: 100%;
            height: 800px;
            border: none;
            display: block;
        }
        
        .footer {
            text-align: center;
            margin-top: 20px;
            color: #999;
            font-size: 14px;
        }
        
        @media (max-width: 768px) {
            iframe {
                height: 600px;
            }
            
            body {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Move Out Sale</h1>
        <p class="subtitle">Check out all available items below</p>
        
        <div class="sheet-container">
            <iframe src="https://docs.google.com/spreadsheets/d/1BnHRZ0MfPdNrnIAFsHvr-QIsZZfm1Kqv1XrTtYfyswo/edit?usp=sharing"></iframe>
        </div>
        
        <div class="footer">
            <p>Embedded spreadsheet for Move Out Sale</p>
        </div>
    </div>
</body>
</html>
